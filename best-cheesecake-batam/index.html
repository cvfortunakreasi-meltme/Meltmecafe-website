<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melt Me — OG Cheezmelt & Dubai Chewy Cheezmelt | Batam</title>
<meta name="description" content="Try the OG Cheezmelt and Dubai Chewy Cheezmelt at Melt Me, 2 minutes from Harbour Bay Ferry Terminal, Batam. Halal-friendly, open daily 10AM–11PM.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F2EA;
    --cream-soft:#EFE6D6;
    --ink:#231A13;
    --ink-soft:#4A3B2E;
    --gold:#B9955C;
    --caramel:#A2582B;
    --caramel-deep:#7C3F1D;
    --line: rgba(35,26,19,0.14);
    --radius: 2px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Jost',sans-serif;
    font-weight:300;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  h1,h2,h3{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    margin:0;
    color:var(--ink);
  }
  a{color:inherit;}
  img{max-width:100%; display:block;}
  :focus-visible{outline:2px solid var(--caramel); outline-offset:3px;}

  .wrap{max-width:1080px; margin:0 auto; padding:0 24px;}

  /* ---- top bar ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 24px;
    border-bottom:1px solid var(--line);
  }
  .topbar .mark{font-family:'Cormorant Garamond',serif; font-size:1.4rem; letter-spacing:0.02em;}
  .topbar .mark em{font-style:italic; color:var(--caramel);}
  .topbar .loc{font-size:0.78rem; color:var(--ink-soft); letter-spacing:0.02em;}
  .topbar .loc span{display:block;}
  @media (max-width:560px){ .topbar .loc{display:none;} }

  /* ---- hero ---- */
  .hero{
    padding:56px 24px 56px;
  }
  .hero-grid{
    display:grid;
    grid-template-columns:1.05fr 0.95fr;
    gap:52px;
    align-items:center;
  }
  @media (max-width:820px){
    .hero-grid{grid-template-columns:1fr; text-align:center;}
    .hero-video{order:-1; margin:0 auto 8px;}
  }
  .hero-video{
    max-width:340px;
    margin:0 auto;
    border:1px solid rgba(35,26,19,0.14);
    padding:10px;
    background:var(--cream-soft);
  }
  .hero-video video{
    width:100%;
    aspect-ratio:9/16;
    object-fit:cover;
    display:block;
  }
  .hero .kicker{
    font-size:0.85rem;
    color:var(--caramel-deep);
    letter-spacing:0.03em;
    margin-bottom:18px;
  }
  .hero h1{
    font-size:clamp(2.1rem, 4.6vw, 3.2rem);
    line-height:1.1;
    margin:0 0 20px;
  }
  .hero h1 em{font-style:italic; color:var(--caramel);}
  .hero p.sub{
    max-width:460px;
    margin:0 0 28px;
    font-size:1.05rem;
    color:var(--ink-soft);
  }
  @media (max-width:820px){ .hero p.sub{margin:0 auto 28px;} }
  .cta-row{
    display:flex; gap:14px; flex-wrap:wrap;
  }
  @media (max-width:820px){ .cta-row{justify-content:center;} }
  .btn{
    display:inline-block;
    padding:14px 30px;
    font-family:'Jost',sans-serif;
    font-size:0.95rem;
    letter-spacing:0.02em;
    border-radius:var(--radius);
    text-decoration:none;
    border:1px solid var(--ink);
    transition:background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .btn-primary{
    background:var(--caramel);
    border-color:var(--caramel);
    color:var(--cream);
  }
  .btn-primary:hover{background:var(--caramel-deep); border-color:var(--caramel-deep);}
  .btn-ghost{
    background:transparent;
    color:var(--ink);
  }
  .btn-ghost:hover{background:var(--ink); color:var(--cream);}

  .proof-strip{
    display:flex; gap:40px; flex-wrap:wrap;
    margin-top:36px;
    font-family:'Cormorant Garamond',serif;
  }
  @media (max-width:820px){ .proof-strip{justify-content:center;} }
  .proof-strip .num{font-size:1.8rem; color:var(--ink);}
  .proof-strip .lbl{font-family:'Jost',sans-serif; font-size:0.78rem; color:var(--ink-soft); letter-spacing:0.02em;}

  /* ---- products ---- */
  .products{
    background:var(--ink);
    color:var(--cream);
    padding:72px 24px;
  }
  .products h2{
    color:var(--cream);
    font-size:clamp(1.8rem,4vw,2.6rem);
    text-align:center;
    max-width:640px;
    margin:0 auto 12px;
  }
  .products .sub{
    text-align:center;
    color:#C8BBAA;
    max-width:520px;
    margin:0 auto 48px;
    font-size:0.98rem;
  }
  .product-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:28px;
  }
  @media (max-width:900px){ .product-grid{grid-template-columns:1fr 1fr;} }
  @media (max-width:600px){ .product-grid{grid-template-columns:1fr; max-width:360px; margin:0 auto;} }
  .product-grid-2{grid-template-columns:1fr 1fr; max-width:640px; margin:0 auto;}
  @media (max-width:600px){ .product-grid-2{grid-template-columns:1fr; max-width:340px;} }
  .product-card{
    background:#2C2118;
    border:1px solid rgba(247,242,234,0.1);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .product-card video{
    width:100%;
    aspect-ratio:9/16;
    object-fit:cover;
    background:#000;
    display:block;
  }
  .product-card .card-body{
    padding:24px 22px 22px;
  }
  .product-card .tag{
    font-size:0.75rem;
    color:var(--gold);
    letter-spacing:0.03em;
    margin-bottom:10px;
  }
  .product-card h3{
    color:var(--cream);
    font-size:1.8rem;
    margin-bottom:10px;
  }
  .product-card p{
    color:#D9CFC0;
    font-size:0.95rem;
    margin:0 0 18px;
  }
  .product-card .price{
    font-family:'Cormorant Garamond',serif;
    font-size:1.25rem;
    color:var(--cream);
    border-top:1px solid rgba(247,242,234,0.14);
    padding-top:16px;
    margin-bottom:20px;
  }
  .product-card .price span{color:var(--gold); font-family:'Jost',sans-serif; font-size:0.75rem; display:block; margin-bottom:4px;}
  .product-card .btn{width:100%; text-align:center;}
